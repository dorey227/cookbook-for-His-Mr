<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>🍳 My Cookbook</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #faf7f2;
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .app {
      max-width: 900px;
      width: 100%;
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      padding: 24px 20px 32px;
    }
    h1 {
      font-weight: 600;
      font-size: 1.9rem;
      color: #3e2e1f;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      margin-bottom: 20px;
      border-bottom: 2px solid #efe6db;
      padding-bottom: 14px;
    }
    h1 small {
      font-size: 1rem;
      font-weight: 400;
      color: #8f7a66;
      margin-left: auto;
    }
    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .tab-btn {
      background: #f0ebe4;
      border: none;
      padding: 10px 18px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.95rem;
      color: #4d3e2e;
      cursor: pointer;
      transition: 0.2s;
      flex: 1 0 auto;
    }
    .tab-btn.active {
      background: #3e2e1f;
      color: white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.08);
    }
    .tab-content {
      display: none;
      animation: fade 0.2s ease;
    }
    .tab-content.active {
      display: block;
    }
    @keyframes fade { from { opacity: 0.5; } to { opacity: 1; } }

    .recipe-grid {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .recipe-card {
      background: #fcf9f6;
      border-radius: 24px;
      padding: 18px;
      border: 1px solid #ede6de;
      cursor: pointer;
      transition: 0.15s;
    }
    .recipe-card:hover {
      border-color: #b8a392;
      background: #f8f3ed;
    }
    .recipe-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 8px;
    }
    .recipe-title {
      font-weight: 600;
      font-size: 1.3rem;
      margin: 0 0 4px 0;
      color: #2d241b;
    }
    .recipe-img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 18px;
      background: #e8dfd6;
      margin: 10px 0 12px 0;
      border: 1px solid #ddd2c6;
    }
    .recipe-img-placeholder {
      width: 100%;
      height: 120px;
      background: #e8dfd6;
      border-radius: 18px;
      margin: 10px 0 12px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8f7a66;
      font-size: 0.9rem;
    }
    .ingredient-list {
      list-style: none;
      padding: 0;
      margin: 8px 0 6px 0;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
    }
    .ingredient-list li {
      background: #ede6de;
      padding: 4px 14px;
      border-radius: 30px;
      font-size: 0.9rem;
      color: #2d241b;
    }
    .macros-display {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin: 8px 0 4px;
      padding: 10px 14px;
      background: #f0ebe4;
      border-radius: 16px;
      font-size: 0.9rem;
    }
    .macros-display span {
      font-weight: 500;
    }
    .macros-display .macro-value {
      color: #3e2e1f;
      font-weight: 600;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
      align-items: center;
      border-top: 1px dashed #ddd2c6;
      padding-top: 14px;
    }
    .btn {
      background: #e8dfd6;
      border: none;
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #2d241b;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary {
      background: #3e2e1f;
      color: white;
    }
    .btn-primary:hover { background: #2d241b; }
    .btn-outline {
      background: transparent;
      border: 1px solid #cdbeb0;
    }
    .btn-outline:hover { background: #f0ebe4; }
    .btn-danger { background: #e8d4cc; color: #7a3e2e; }
    .btn-danger:hover { background: #dcc2b8; }
    .btn-success { background: #2d7a4a; color: white; }
    .btn-success:hover { background: #1f5f38; }
    .btn-auto { background: #4a6fa5; color: white; }
    .btn-auto:hover { background: #3a5a8a; }

    .empty-state {
      text-align: center;
      color: #8f7a66;
      padding: 40px 10px;
    }

    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-weight: 500;
      margin-bottom: 5px;
      color: #3e2e1f;
    }
    .form-control {
      width: 100%;
      padding: 12px 16px;
      border-radius: 40px;
      border: 1px solid #ddd2c6;
      background: #fcf9f6;
      font-size: 1rem;
      transition: 0.15s;
    }
    .form-control:focus {
      outline: 2px solid #b8a392;
      border-color: transparent;
    }
    textarea.form-control {
      border-radius: 24px;
      resize: vertical;
      min-height: 70px;
    }
    .ingredient-input-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .ingredient-input-group input {
      flex: 2;
      min-width: 120px;
    }
    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0 4px;
    }
    .chip {
      background: #e8dfd6;
      padding: 4px 14px;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }
    .chip .remove {
      cursor: pointer;
      font-weight: 600;
      color: #7a5f48;
    }

    .macros-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .macro-input-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .macro-input-group label {
      min-width: 50px;
      font-weight: 500;
      margin: 0;
    }
    .macro-input-group input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 30px;
      border: 1px solid #ddd2c6;
      font-size: 0.95rem;
      width: 80px;
    }

    .shopping-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-bottom: 1px solid #ede6de;
    }
    .shopping-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #3e2e1f;
    }
    .shopping-item .item-name {
      flex: 1;
      font-size: 1rem;
    }
    .shopping-item .item-source {
      font-size: 0.8rem;
      color: #8f7a66;
    }

    .footer-bar {
      display: flex;
      gap: 8px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: space-between;
    }
    #fileInput { display: none; }
    .photo-upload-area {
      border: 2px dashed #ddd2c6;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      background: #fcf9f6;
    }
    .photo-upload-area:hover {
      background: #f5efe8;
      border-color: #b8a392;
    }
    .photo-preview {
      max-height: 200px;
      border-radius: 16px;
      margin-top: 10px;
      display: none;
      width: 100%;
      object-fit: cover;
    }
    .photo-preview.show {
      display: block;
    }
    .photo-upload-area.has-image {
      border-color: #3e2e1f;
      background: #f5efe8;
    }
    .inline-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .macro-auto-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    .macro-auto-row .btn {
      padding: 8px 16px;
    }
    .auto-progress {
      font-size: 0.85rem;
      color: #4a6fa5;
      margin-left: 8px;
    }
  </style>
</head>
<body>
<div class="app">
  <h1>
    🍳 My Cookbook
    <small>PC · iOS</small>
  </h1>

  <div class="tabs">
    <button class="tab-btn active" data-tab="recipes">📖 Recipes</button>
    <button class="tab-btn" data-tab="shopping">🛒 Shopping</button>
    <button class="tab-btn" data-tab="add">➕ New</button>
  </div>

  <!-- RECIPES TAB -->
  <div id="tab-recipes" class="tab-content active">
    <div style="display:flex; justify-content:flex-end; gap:8px; margin-bottom:16px; flex-wrap:wrap;">
      <button class="btn btn-outline" id="exportBtn">📤 Export</button>
      <button class="btn btn-outline" id="importBtn">📥 Import</button>
      <input type="file" id="importFileInput" accept=".json" style="display:none;">
    </div>
    <div id="recipeList" class="recipe-grid"></div>
  </div>

  <!-- SHOPPING TAB -->
  <div id="tab-shopping" class="tab-content">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-bottom:12px;">
      <h3 style="margin:0; color:#3e2e1f;">🛒 Shopping list</h3>
      <button class="btn btn-outline" id="clearShoppingBtn">Clear checked</button>
    </div>
    <div id="shoppingListContainer"></div>
    <div class="footer-bar">
      <button class="btn btn-outline" id="addCustomShoppingBtn">➕ Add item</button>
    </div>
  </div>

  <!-- ADD/EDIT RECIPE TAB -->
  <div id="tab-add" class="tab-content">
    <h3 style="margin-top:0;" id="formTitle">📝 New Recipe</h3>
    <input type="hidden" id="editIndex" value="-1">
    
    <div class="form-group">
      <label>Recipe name *</label>
      <input class="form-control" id="recipeName" placeholder="e.g. Spaghetti aglio e olio">
    </div>

    <div class="form-group">
      <label>📸 Photo</label>
      <div class="photo-upload-area" id="photoUploadArea">
        <div id="photoUploadText">Tap to add or change photo</div>
        <input type="file" accept="image/*" id="fileInput">
        <img id="photoPreview" class="photo-preview" alt="Preview">
      </div>
    </div>

    <div class="form-group">
      <label>Ingredients *</label>
      <div class="ingredient-input-group">
        <input class="form-control" id="ingredientInput" placeholder="e.g. 200g spaghetti">
        <button class="btn btn-primary" id="addIngredientBtn">+ Add</button>
      </div>
      <div id="ingredientChips" class="chip-group"></div>
    </div>

    <div class="form-group">
      <label>📊 Macros (per serving)</label>
      <div class="macros-grid">
        <div class="macro-input-group">
          <label>🔥 Cal</label>
          <input class="form-control" id="macroCal" placeholder="0" type="number" step="1">
        </div>
        <div class="macro-input-group">
          <label>💪 Protein</label>
          <input class="form-control" id="macroProtein" placeholder="0g" type="number" step="0.1">
        </div>
        <div class="macro-input-group">
          <label>🍞 Carbs</label>
          <input class="form-control" id="macroCarbs" placeholder="0g" type="number" step="0.1">
        </div>
        <div class="macro-input-group">
          <label>🥑 Fat</label>
          <input class="form-control" id="macroFat" placeholder="0g" type="number" step="0.1">
        </div>
      </div>
      <div class="macro-auto-row">
        <button class="btn btn-auto" id="autoMacroBtn">🤖 Auto-Calculate Macros</button>
        <span class="auto-progress" id="autoProgress"></span>
      </div>
      <div style="font-size:0.8rem; color:#8f7a66; margin-top:4px;">Auto-calc estimates based on ingredients. Manual entry overrides auto-calc.</div>
    </div>

    <div class="form-group">
      <label>Instructions</label>
      <textarea class="form-control" id="instructionsInput" placeholder="Boil water, cook pasta..."></textarea>
    </div>

    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn btn-primary" id="saveRecipeBtn" style="flex:2; padding:14px; font-size:1.1rem;">💾 Save Recipe</button>
      <button class="btn btn-outline" id="cancelEditBtn" style="flex:1; padding:14px; font-size:1.1rem;">✕ Cancel</button>
    </div>
  </div>
</div>

<script>
  (function() {
    // ===== DATA =====
    let recipes = JSON.parse(localStorage.getItem('cookbook_recipes')) || [];
    let shoppingItems = JSON.parse(localStorage.getItem('cookbook_shopping')) || [];
    let tempIngredients = [];
    let editingIndex = -1;

    // ===== FOOD DATABASE =====
    const foodDB = {
      'chicken breast': { cal: 165, protein: 31, carbs: 0, fat: 3.6 },
      'chicken': { cal: 165, protein: 31, carbs: 0, fat: 3.6 },
      'beef': { cal: 250, protein: 26, carbs: 0, fat: 17 },

      'egg': { cal: 155, protein: 13, carbs: 1.1, fat: 11 },
      'milk': { cal: 42, protein: 3.4, carbs: 5, fat: 1 },
      'yogurt': { cal: 61, protein: 3.5, carbs: 4.7, fat: 3.3 },
      'cheese': { cal: 404, protein: 25, carbs: 1.3, fat: 33 },
      'parmesan': { cal: 431, protein: 38, carbs: 4.1, fat: 29 },
      'mozzarella': { cal: 280, protein: 28, carbs: 3.1, fat: 17 },
      'pasta': { cal: 131, protein: 5, carbs: 25, fat: 1.1 },
      'spaghetti': { cal: 131, protein: 5, carbs: 25, fat: 1.1 },
      'rice': { cal: 130, protein: 2.7, carbs: 28, fat: 0.3 },
      'quinoa': { cal: 120, protein: 4.4, carbs: 21, fat: 1.9 },
      'bread': { cal: 265, protein: 9, carbs: 49, fat: 3.2 },
      'potato': { cal: 77, protein: 2, carbs: 17, fat: 0.1 },
      'sweet potato': { cal: 86, protein: 1.6, carbs: 20, fat: 0.1 },
      'tomato': { cal: 18, protein: 0.9, carbs: 3.9, fat: 0.2 },
      'onion': { cal: 40, protein: 1.1, carbs: 9.3, fat: 0.1 },
      'garlic': { cal: 149, protein: 6.4, carbs: 33, fat: 0.5 },
      'olive oil': { cal: 884, protein: 0, carbs: 0, fat: 100 },
      'oil': { cal: 884, protein: 0, carbs: 0, fat: 100 },
      'butter': { cal: 717, protein: 0.9, carbs: 0.1, fat: 81 },
      'cream': { cal: 345, protein: 2.8, carbs: 2.8, fat: 37 },
      'flour': { cal: 364, protein: 10, carbs: 76, fat: 1 },
      'sugar': { cal: 387, protein: 0, carbs: 100, fat: 0 },
      'honey': { cal: 304, protein: 0.3, carbs: 82, fat: 0 },
      'salt': { cal: 0, protein: 0, carbs: 0, fat: 0 },
      'pepper': { cal: 20, protein: 0, carbs: 5, fat: 0 },
      'broccoli': { cal: 34, protein: 2.8, carbs: 7, fat: 0.4 },
      'spinach': { cal: 23, protein: 2.9, carbs: 3.6, fat: 0.4 },
      'kale': { cal: 49, protein: 4.3, carbs: 9, fat: 0.9 },
      'carrot': { cal: 41, protein: 0.9, carbs: 10, fat: 0.2 },
      'bell pepper': { cal: 26, protein: 1, carbs: 6, fat: 0.3 },
      'mushroom': { cal: 22, protein: 3.1, carbs: 3.3, fat: 0.3 },
      'avocado': { cal: 160, protein: 2, carbs: 9, fat: 15 },
      'beans': { cal: 132, protein: 8.7, carbs: 23, fat: 0.5 },
      'black beans': { cal: 132, protein: 8.9, carbs: 23, fat: 0.5 },
      'kidney beans': { cal: 127, protein: 8.7, carbs: 22, fat: 0.5 },
      'lentils': { cal: 116, protein: 9, carbs: 20, fat: 0.4 },
      'chickpeas': { cal: 139, protein: 8.9, carbs: 27, fat: 2.6 },
      'nuts': { cal: 607, protein: 20, carbs: 21, fat: 54 },
      'almonds': { cal: 579, protein: 21, carbs: 22, fat: 50 },
      'walnuts': { cal: 654, protein: 15, carbs: 14, fat: 65 },
      'peanut butter': { cal: 588, protein: 25, carbs: 20, fat: 50 },
      'oatmeal': { cal: 71, protein: 2.5, carbs: 12, fat: 1.4 },
      'coconut milk': { cal: 230, protein: 2.3, carbs: 5.5, fat: 24 },
      'soy sauce': { cal: 53, protein: 8.5, carbs: 4.9, fat: 0.6 },
      'vinegar': { cal: 18, protein: 0, carbs: 0.9, fat: 0 },
      'lemon': { cal: 29, protein: 1.1, carbs: 9.3, fat: 0.3 },
      'lime': { cal: 30, protein: 0.7, carbs: 11, fat: 0.2 },
      'ginger': { cal: 80, protein: 1.8, carbs: 18, fat: 0.8 },
      'basil': { cal: 44, protein: 3.2, carbs: 2.7, fat: 0.6 },
      'oregano': { cal: 265, protein: 9, carbs: 69, fat: 4.3 },
      'thyme': { cal: 101, protein: 5.6, carbs: 24, fat: 1.7 },
      'rosemary': { cal: 131, protein: 3.3, carbs: 21, fat: 5.9 },
      'cumin': { cal: 375, protein: 18, carbs: 44, fat: 22 },
      'paprika': { cal: 282, protein: 14, carbs: 54, fat: 13 },
      'chili': { cal: 282, protein: 12, carbs: 56, fat: 14 },
      'cinnamon': { cal: 247, protein: 4, carbs: 80, fat: 1.2 },
    };

    // ===== DOM REFS =====
    const recipeListEl = document.getElementById('recipeList');
    const shoppingContainer = document.getElementById('shoppingListContainer');
    const fileInput = document.getElementById('fileInput');
    const photoPreview = document.getElementById('photoPreview');
    const photoUploadArea = document.getElementById('photoUploadArea');
    const photoUploadText = document.getElementById('photoUploadText');
    const ingredientInput = document.getElementById('ingredientInput');
    const addIngredientBtn = document.getElementById('addIngredientBtn');
    const ingredientChips = document.getElementById('ingredientChips');
    const recipeName = document.getElementById('recipeName');
    const instructionsInput = document.getElementById('instructionsInput');
    const saveRecipeBtn = document.getElementById('saveRecipeBtn');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const formTitle = document.getElementById('formTitle');
    const editIndexInput = document.getElementById('editIndex');
    const macroCal = document.getElementById('macroCal');
    const macroProtein = document.getElementById('macroProtein');
    const macroCarbs = document.getElementById('macroCarbs');
    const macroFat = document.getElementById('macroFat');
    const autoMacroBtn = document.getElementById('autoMacroBtn');
    const autoProgress = document.getElementById('autoProgress');

    // ===== SAVE FUNCTIONS =====
    function saveRecipes() {
      localStorage.setItem('cookbook_recipes', JSON.stringify(recipes));
    }
    function saveShopping() {
      localStorage.setItem('cookbook_shopping', JSON.stringify(shoppingItems));
    }

    // ===== RESET FORM =====
    function resetForm() {
      recipeName.value = '';
      tempIngredients = [];
      instructionsInput.value = '';
      fileInput.value = '';
      photoPreview.classList.remove('show');
      photoPreview.src = '';
      photoUploadArea.classList.remove('has-image');
      photoUploadText.textContent = 'Tap to add or change photo';
      macroCal.value = '';
      macroProtein.value = '';
      macroCarbs.value = '';
      macroFat.value = '';
      autoProgress.textContent = '';
      editingIndex = -1;
      editIndexInput.value = '-1';
      formTitle.textContent = '📝 New Recipe';
      renderIngredientChips();
    }

    // ===== LOAD RECIPE FOR EDIT =====
    function loadRecipeForEdit(index) {
      const recipe = recipes[index];
      if (!recipe) return;
      
      editingIndex = index;
      editIndexInput.value = index;
      formTitle.textContent = '✏️ Edit Recipe';
      
      recipeName.value = recipe.name || '';
      instructionsInput.value = recipe.instructions || '';
      
      tempIngredients = recipe.ingredients ? [...recipe.ingredients] : [];
      renderIngredientChips();
      
      if (recipe.image && recipe.image.startsWith('data:image')) {
        photoPreview.src = recipe.image;
        photoPreview.classList.add('show');
        photoUploadArea.classList.add('has-image');
        photoUploadText.textContent = 'Change photo';
      } else {
        photoPreview.classList.remove('show');
        photoPreview.src = '';
        photoUploadArea.classList.remove('has-image');
        photoUploadText.textContent = 'Tap to add or change photo';
      }
      
      if (recipe.macros) {
        macroCal.value = recipe.macros.cal || '';
        macroProtein.value = recipe.macros.protein || '';
        macroCarbs.value = recipe.macros.carbs || '';
        macroFat.value = recipe.macros.fat || '';
      } else {
        macroCal.value = '';
        macroProtein.value = '';
        macroCarbs.value = '';
        macroFat.value = '';
      }
      autoProgress.textContent = '';
      
      activateTab('add');
    }

    // ===== AUTO-CALCULATE MACROS =====
    function autoCalculateMacros() {
      const ingredients = tempIngredients;
      if (!ingredients || ingredients.length === 0) {
        autoProgress.textContent = '⚠️ Add ingredients first!';
        setTimeout(() => { autoProgress.textContent = ''; }, 3000);
        return;
      }

      autoProgress.textContent = '🔍 Analyzing ingredients...';
      
      setTimeout(() => {
        let totalCal = 0, totalProtein = 0, totalCarbs = 0, totalFat = 0;
        let matchedCount = 0;

        ingredients.forEach(ing => {
          const ingLower = ing.toLowerCase();
          let found = false;
          
          for (const [key, value] of Object.entries(foodDB)) {
            if (ingLower.includes(key) || key.includes(ingLower)) {
              let quantity = 100;
              const match = ing.match(/(\d+)\s*(g|kg|ml|l|oz|lb)?/i);
              if (match) {
                let qty = parseFloat(match[1]);
                const unit = match[2] ? match[2].toLowerCase() : 'g';
                if (unit === 'kg' || unit === 'l') qty = qty * 1000;
                else if (unit === 'oz') qty = qty * 28.35;
                else if (unit === 'lb') qty = qty * 453.6;
                quantity = qty;
              }
              
              const factor = quantity / 100;
              totalCal += value.cal * factor;
              totalProtein += value.protein * factor;
              totalCarbs += value.carbs * factor;
              totalFat += value.fat * factor;
              found = true;
              matchedCount++;
              break;
            }
          }
          
          if (!found) {
            if (ingLower.includes('oil') || ingLower.includes('butter')) {
              totalCal += 800;
              totalFat += 90;
            } else if (ingLower.includes('meat') || ingLower.includes('chicken') || ingLower.includes('beef') || ingLower.includes('pork')) {
              totalCal += 200;
              totalProtein += 25;
              totalFat += 10;
            } else if (ingLower.includes('flour') || ingLower.includes('sugar') || ingLower.includes('rice') || ingLower.includes('pasta')) {
              totalCal += 130;
              totalCarbs += 25;
            } else {
              totalCal += 50;
              totalCarbs += 5;
              totalProtein += 1;
            }
          }
        });

        if (matchedCount === 0 && ingredients.length > 0) {
          autoProgress.textContent = '⚠️ No ingredients recognized. Manual entry recommended.';
          setTimeout(() => { autoProgress.textContent = ''; }, 3000);
        } else {
          autoProgress.textContent = `✅ Matched ${matchedCount}/${ingredients.length} ingredients`;
          setTimeout(() => { autoProgress.textContent = ''; }, 2000);
        }

        macroCal.value = Math.round(totalCal);
        macroProtein.value = Math.round(totalProtein * 10) / 10;
        macroCarbs.value = Math.round(totalCarbs * 10) / 10;
        macroFat.value = Math.round(totalFat * 10) / 10;

        if (totalCal === 0 && totalProtein === 0 && totalCarbs === 0 && totalFat === 0) {
          autoProgress.textContent = '⚠️ Could not detect ingredients. Try more specific names.';
          setTimeout(() => { autoProgress.textContent = ''; }, 3000);
        }
      }, 100);
    }

    autoMacroBtn.addEventListener('click', autoCalculateMacros);

    // ===== RENDER RECIPES =====
    function renderRecipes() {
      if (!recipes.length) {
        recipeListEl.innerHTML = `<div class="empty-state">🍽️ No recipes yet. Add your first!</div>`;
        return;
      }
      let html = '';
      recipes.forEach((r, idx) => {
        let imgHtml = '';
        if (r.image && r.image.startsWith('data:image')) {
          imgHtml = `<img src="${r.image}" class="recipe-img" alt="${r.name}">`;
        } else {
          imgHtml = `<div class="recipe-img-placeholder">📸 No photo</div>`;
        }
        
        const ingredientsHtml = r.ingredients && r.ingredients.length 
          ? `<ul class="ingredient-list">${r.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>`
          : '<div style="color:#8f7a66; font-size:0.9rem;">No ingredients</div>';
        
        let macrosHtml = '';
        if (r.macros && (r.macros.cal || r.macros.protein || r.macros.carbs || r.macros.fat)) {
          macrosHtml = `
            <div class="macros-display">
              <span>🔥 <span class="macro-value">${r.macros.cal || 0}</span> cal</span>
              <span>💪 <span class="macro-value">${r.macros.protein || 0}</span>g</span>
              <span>🍞 <span class="macro-value">${r.macros.carbs || 0}</span>g</span>
              <span>🥑 <span class="macro-value">${r.macros.fat || 0}</span>g</span>
            </div>
          `;
        }
        
        html += `
          <div class="recipe-card" data-index="${idx}">
            <div class="recipe-header">
              <div>
                <div class="recipe-title">${r.name}</div>
              </div>
              <div class="inline-actions">
                <button class="btn btn-outline edit-recipe-btn" data-index="${idx}">✏️ Edit</button>
                <button class="btn btn-outline add-to-shopping-btn" data-index="${idx}">🛒 + list</button>
                <button class="btn btn-danger delete-recipe-btn" data-index="${idx}">✕</button>
              </div>
            </div>
            ${imgHtml}
            ${ingredientsHtml}
            ${macrosHtml}
            ${r.instructions ? `<div style="margin-top:8px; color:#3e2e1f; white-space:pre-wrap; font-size:0.95rem;">${r.instructions}</div>` : ''}
            <div class="actions">
              <span style="font-size:0.8rem; color:#8f7a66;">${r.ingredients ? r.ingredients.length : 0} ingredients</span>
              <span class="edit-hint" style="font-size:0.75rem; color:#8f7a66;">👆 Tap card to edit</span>
            </div>
          </div>
        `;
      });
      recipeListEl.innerHTML = html;

      document.querySelectorAll('.recipe-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.closest('button')) return;
          const idx = parseInt(card.dataset.index);
          loadRecipeForEdit(idx);
        });
      });

      document.querySelectorAll('.edit-recipe-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(btn.dataset.index);
          loadRecipeForEdit(idx);
        });
      });

      document.querySelectorAll('.delete-recipe-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(btn.dataset.index);
          if (confirm(`Delete "${recipes[idx].name}"?`)) {
            recipes.splice(idx, 1);
            saveRecipes();
            renderRecipes();
            renderShopping();
          }
        });
      });

      document.querySelectorAll('.add-to-shopping-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(btn.dataset.index);
          const recipe = recipes[idx];
          if (recipe && recipe.ingredients) {
            recipe.ingredients.forEach(ing => {
              shoppingItems.push({ name: ing, checked: false, source: recipe.name });
            });
            saveShopping();
            renderShopping();
          }
        });
      });
    }

    // ===== RENDER SHOPPING =====
    function renderShopping() {
      if (!shoppingItems.length) {
        shoppingContainer.innerHTML = `<div class="empty-state">🛒 Your shopping list is empty.</div>`;
        return;
      }
      let html = '';
      shoppingItems.forEach((item, idx) => {
        const checked = item.checked ? 'checked' : '';
        html += `
          <div class="shopping-item" data-index="${idx}">
            <input type="checkbox" ${checked} class="shopping-checkbox">
            <span class="item-name">${item.name}</span>
            <span class="item-source">${item.source ? '📖 ' + item.source : ''}</span>
            <button class="btn btn-danger" style="padding:2px 12px; font-size:0.8rem;" data-shopping-index="${idx}">✕</button>
          </div>
        `;
      });
      shoppingContainer.innerHTML = html;

      document.querySelectorAll('.shopping-checkbox').forEach((cb, idx) => {
        cb.addEventListener('change', (e) => {
          shoppingItems[idx].checked = cb.checked;
          saveShopping();
        });
      });

      document.querySelectorAll('[data-shopping-index]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idx = parseInt(btn.dataset.shoppingIndex);
          shoppingItems.splice(idx, 1);
          saveShopping();
          renderShopping();
        });
      });
    }

    // ===== PHOTO UPLOAD =====
    photoUploadArea.addEventListener('click', () => {
      fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          photoPreview.src = ev.target.result;
          photoPreview.classList.add('show');
          photoUploadArea.classList.add('has-image');
          photoUploadText.textContent = 'Change photo';
        };
        reader.readAsDataURL(file);
      }
    });

    // ===== INGREDIENTS =====
    function renderIngredientChips() {
      ingredientChips.innerHTML = tempIngredients.map((ing, i) => 
        `<span class="chip">${ing} <span class="remove" data-ing-index="${i}">✕</span></span>`
      ).join('');
      document.querySelectorAll('.chip .remove').forEach(el => {
        el.addEventListener('click', (e) => {
          const idx = parseInt(el.dataset.ingIndex);
          tempIngredients.splice(idx, 1);
          renderIngredientChips();
        });
      });
    }

    addIngredientBtn.addEventListener('click', () => {
      const val = ingredientInput.value.trim();
      if (val) {
        tempIngredients.push(val);
        ingredientInput.value = '';
        renderIngredientChips();
      }
    });
    ingredientInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        addIngredientBtn.click();
      }
    });

    // ===== SAVE RECIPE =====
    saveRecipeBtn.addEventListener('click', () => {
      const name = recipeName.value.trim();
      if (!name) { alert('Please enter a recipe name.'); return; }
      if (!tempIngredients.length) { alert('Add at least one ingredient.'); return; }

      const recipeData = {
        name: name,
        ingredients: [...tempIngredients],
        instructions: instructionsInput.value.trim(),
        image: photoPreview.src && photoPreview.classList.contains('show') ? photoPreview.src : '',
        macros: {
          cal: parseFloat(macroCal.value) || 0,
          protein: parseFloat(macroProtein.value) || 0,
          carbs: parseFloat(macroCarbs.value) || 0,
          fat: parseFloat(macroFat.value) || 0
        }
      };

      const editIdx = parseInt(editIndexInput.value);
      if (editIdx >= 0 && editIdx < recipes.length) {
        recipes[editIdx] = recipeData;
      } else {
        recipes.push(recipeData);
      }
      
      saveRecipes();
      resetForm();
      activateTab('recipes');
      renderRecipes();
    });

    // ===== CANCEL EDIT =====
    cancelEditBtn.addEventListener('click', () => {
      if (editingIndex >= 0) {
        if (confirm('Cancel editing? Changes will be lost.')) {
          resetForm();
          activateTab('recipes');
        }
      } else {
        resetForm();
        activateTab('recipes');
      }
    });

    // ===== EXPORT/IMPORT =====
    document.getElementById('exportBtn').addEventListener('click', () => {
      const data = {
        recipes: recipes,
        shopping: shoppingItems,
        exportedAt: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `cookbook_backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('importBtn').addEventListener('click', () => {
      document.getElementById('importFileInput').click();
    });

    document.getElementById('importFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (data.recipes && Array.isArray(data.recipes)) {
            if (confirm(`Import ${data.recipes.length} recipes and ${data.shopping?.length || 0} shopping items? (Current data will be replaced)`)) {
              recipes = data.recipes;
              shoppingItems = data.shopping || [];
              saveRecipes();
              saveShopping();
              renderRecipes();
              renderShopping();
              alert('✅ Import successful!');
            }
          } else {
            alert('❌ Invalid file format.');
          }
        } catch (err) {
          alert('❌ Error reading file: ' + err.message);
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    // ===== SHOPPING ACTIONS =====
    document.getElementById('clearShoppingBtn').addEventListener('click', () => {
      shoppingItems = shoppingItems.filter(item => !item.checked);
      saveShopping();
      renderShopping();
    });

    document.getElementById('addCustomShoppingBtn').addEventListener('click', () => {
      const itemName = prompt('Enter item name:');
      if (itemName && itemName.trim()) {
        shoppingItems.push({ name: itemName.trim(), checked: false, source: 'manual' });
        saveShopping();
        renderShopping();
      }
    });

    // ===== TABS =====
    function activateTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tabId}`).classList.add('active');
      document.querySelector(`.tab-btn[data-tab="${tabId}"]`).classList.add('active');
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        activateTab(tab);
        if (tab === 'recipes') {
          renderRecipes();
          if (editingIndex >= 0) resetForm();
        }
        if (tab === 'shopping') renderShopping();
        if (tab === 'add') {
          if (editingIndex < 0) resetForm();
        }
      });
    });

    // ===== INIT =====
    renderRecipes();
    renderShopping();
    renderIngredientChips();
  })();
</script>
</body>
</html>
